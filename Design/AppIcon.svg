<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- VaultSearch app icon (obsidian crystal + magnifier). Style: indigo gradient,
       violet glow, soft wave, white outline shapes, coral hit, mint glow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3B2BA8"/>
      <stop offset="0.35" stop-color="#1E1670"/>
      <stop offset="1" stop-color="#120D4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.35">
      <stop offset="0" stop-color="#8F7BFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8F7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0.4">
      <stop offset="0" stop-color="#5B45E0" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#5B45E0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6A52F0" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9580"/>
      <stop offset="1" stop-color="#FF6A5C"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4A36C8" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#150F55" stop-opacity="0.97"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06041F" flood-opacity="0.45"/>
    </filter>
    <filter id="mintglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <!-- macOS icon grid: 824pt body centred in a 1024pt canvas -->
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="lensclip"><circle cx="650" cy="600" r="112"/></clipPath>
  </defs>

  <g filter="url(#iconshadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#120D4A"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <path d="M100 924 L100 872 C 310 824, 552 800, 714 744 C 811 710, 872 664, 924 615 L924 924 Z" fill="url(#wave)"/>
  </g>

  <!-- obsidian crystal, outline -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- the hit: the front facet in coral -->
    <g filter="url(#shadow)"><path d="M318 566 L446 448 L556 772 L398 758 Z" fill="url(#coral)" stroke="none"/></g>
    <path d="M352 566 L440 486" stroke="#FFE3DC" stroke-opacity="0.55" stroke-width="7"/>
    <!-- ridges -->
    <path d="M506 230 L446 448 L556 772" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="16"/>
    <path d="M446 448 L318 566" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="16"/>
    <path d="M506 230 L590 470" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="12"/>
    <!-- outline -->
    <path d="M506 230 L630 352 L652 560 L556 772 L398 758 L318 566 L378 352 Z" stroke="#FFFFFF" stroke-width="30"/>
    <!-- mint glint -->
    <path d="M410 350 L470 282" stroke="#3CF5C4" stroke-width="12" filter="url(#mintglow)"/>
  </g>

  <!-- magnifier -->
  <line x1="736" y1="686" x2="806" y2="756" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" filter="url(#shadow)"/>
  <circle cx="650" cy="600" r="112" fill="url(#lens)"/>
  <g clip-path="url(#lensclip)">
    <path d="M430 520 L590 520 L700 900 L430 900 Z" fill="url(#coral)"/>
    <path d="M590 470 L640 620 L700 760" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="18" stroke-linecap="round"/>
    <path d="M760 480 L700 760" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
  </g>
  <circle cx="650" cy="600" r="112" fill="none" stroke="#3CF5C4" stroke-width="26" filter="url(#mintglow)"/>
  <path d="M590 548 A 78 78 0 0 1 650 522" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
</svg>
